{% extends 'base.html' %}
{% load static %}

{% block title %}| 404{% endblock %}

{% block content %}

  <section class="py-20">
    <div class="max-w-lg mx-auto px-6 text-center">
      <div class="text-8xl font-bold text-tt-orange/20 mb-6">404</div>
      <h1 class="text-2xl font-bold text-tt-navy mb-4">Pagina nu a fost găsită</h1>
      <p class="text-tt-text-light mb-8">Ne pare rău, pagina pe care încercați să o accesați nu este disponibilă.</p>
      <a href="{% url 'index' %}" class="inline-flex items-center gap-2 bg-tt-navy text-white px-6 py-3 rounded-xl font-semibold hover:bg-tt-navy-deep transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Înapoi la pagina principală
      </a>
    </div>
  </section>

{% endblock %}
