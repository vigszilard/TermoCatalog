{% extends 'base.html' %}

{% block title %}| Întrebări frecvente{% endblock %}

{% block content %}

  <!-- Header -->
  <section class="relative -mt-20 bg-tt-navy overflow-hidden">
    <div class="relative max-w-7xl mx-auto px-6 pt-36 pb-16">
      <p class="text-tt-orange font-semibold text-sm tracking-widest uppercase mb-4">Suport</p>
      <h1 class="text-4xl font-bold text-white">Întrebări frecvente</h1>
    </div>
  </section>

  <section class="py-16">
    <div class="max-w-3xl mx-auto px-6">
      {% if faqs %}
        <div class="space-y-4" x-data="{ openId: null }">
          {% for faq in faqs %}
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden transition-shadow"
                 :class="openId === {{ faq.pk }} ? 'shadow-md ring-1 ring-tt-navy/20' : ''">
              <button @click="openId = openId === {{ faq.pk }} ? null : {{ faq.pk }}"
                      class="w-full text-left px-6 py-5 flex justify-between items-center gap-4 cursor-pointer">
                <span class="font-semibold transition-colors"
                      :class="openId === {{ faq.pk }} ? 'text-tt-orange' : 'text-tt-navy'">
                  {{ faq.question }}
                </span>
                <span class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 transition-all duration-300"
                      :class="openId === {{ faq.pk }} ? 'bg-tt-navy text-white rotate-180' : 'bg-tt-bg text-tt-text-light'">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                  </svg>
                </span>
              </button>
              <div x-show="openId === {{ faq.pk }}" x-collapse x-cloak>
                <div class="px-6 pb-5 text-tt-text-light leading-relaxed">
                  {{ faq.answer | linebreaks }}
                </div>
              </div>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </section>

{% endblock %}
