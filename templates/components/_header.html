{% load static %}

<header class="fixed top-0 w-full z-50 transition-all duration-300"
        :class="scrolled ? 'bg-white shadow-lg' : 'bg-tt-navy'"
        x-data="{ mobileOpen: false }">
  <div class="max-w-7xl mx-auto px-6">
    <nav class="flex items-center justify-between h-[72px]">
      <!-- Logo -->
      <a href="{% url 'index' %}" class="shrink-0">
        <img :src="scrolled ? '{% static 'img/termo-black.png' %}' : '{% static 'img/termo-white.png' %}'"
             alt="Termototal" class="h-9 transition-all duration-300">
      </a>

      <!-- Hamburger -->
      <button @click="mobileOpen = !mobileOpen" class="lg:hidden p-2 rounded-lg"
              :class="scrolled ? 'text-tt-navy' : 'text-white'">
        <svg x-show="!mobileOpen" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        <svg x-show="mobileOpen" x-cloak class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>

      <!-- Desktop nav -->
      <div class="hidden lg:flex items-center gap-1">
        <a href="{% url 'index' %}" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
           :class="scrolled ? '{% if '/' == request.path %}bg-tt-navy text-white{% else %}text-tt-navy hover:bg-tt-navy/5{% endif %}' : '{% if '/' == request.path %}bg-white/15 text-white{% else %}text-white/75 hover:text-white hover:bg-white/10{% endif %}'">Produse</a>
        <a href="{% url 'designs' %}" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
           :class="scrolled ? '{% if '/des/' == request.path %}bg-tt-navy text-white{% else %}text-tt-navy hover:bg-tt-navy/5{% endif %}' : '{% if '/des/' == request.path %}bg-white/15 text-white{% else %}text-white/75 hover:text-white hover:bg-white/10{% endif %}'">Personalizare</a>
        <a href="{% url 'about' %}" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
           :class="scrolled ? '{% if '/about' == request.path %}bg-tt-navy text-white{% else %}text-tt-navy hover:bg-tt-navy/5{% endif %}' : '{% if '/about' == request.path %}bg-white/15 text-white{% else %}text-white/75 hover:text-white hover:bg-white/10{% endif %}'">Despre</a>
        <a href="{% url 'contact' %}" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
           :class="scrolled ? '{% if '/contact' == request.path %}bg-tt-navy text-white{% else %}text-tt-navy hover:bg-tt-navy/5{% endif %}' : '{% if '/contact' == request.path %}bg-white/15 text-white{% else %}text-white/75 hover:text-white hover:bg-white/10{% endif %}'">Contact</a>
        <a href="{% url 'faq' %}" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
           :class="scrolled ? '{% if '/faq' == request.path %}bg-tt-navy text-white{% else %}text-tt-navy hover:bg-tt-navy/5{% endif %}' : '{% if '/faq' == request.path %}bg-white/15 text-white{% else %}text-white/75 hover:text-white hover:bg-white/10{% endif %}'">FAQ</a>

        <div class="flex items-center gap-1 ml-3 pl-3 border-l" :class="scrolled ? 'border-tt-border' : 'border-white/20'">
          <a href="https://www.termototal.ro/" target="_blank" class="p-2 rounded-lg transition-colors" :class="scrolled ? 'text-tt-text-light hover:text-tt-navy' : 'text-white/50 hover:text-white'">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>
          </a>
          <a href="https://www.facebook.com/termototal/" target="_blank" class="p-2 rounded-lg transition-colors" :class="scrolled ? 'text-tt-text-light hover:text-tt-navy' : 'text-white/50 hover:text-white'">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </a>
          <a href="https://www.instagram.com/termototal/" target="_blank" class="p-2 rounded-lg transition-colors" :class="scrolled ? 'text-tt-text-light hover:text-tt-navy' : 'text-white/50 hover:text-white'">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          </a>
        </div>
      </div>
    </nav>
  </div>

  <!-- Mobile menu -->
  <div x-show="mobileOpen" x-collapse x-cloak class="lg:hidden border-t" :class="scrolled ? 'bg-white border-tt-border' : 'bg-tt-navy-deep border-white/10'">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col gap-1">
      <a href="{% url 'index' %}" class="px-4 py-3 rounded-lg font-medium {% if '/' == request.path %}bg-tt-orange text-white{% endif %}" :class="scrolled ? '{% if '/' != request.path %}text-tt-navy hover:bg-tt-bg{% endif %}' : '{% if '/' != request.path %}text-white/80 hover:bg-white/10{% endif %}'">Produse</a>
      <a href="{% url 'designs' %}" class="px-4 py-3 rounded-lg font-medium {% if '/des/' == request.path %}bg-tt-orange text-white{% endif %}" :class="scrolled ? '{% if '/des/' != request.path %}text-tt-navy hover:bg-tt-bg{% endif %}' : '{% if '/des/' != request.path %}text-white/80 hover:bg-white/10{% endif %}'">Personalizare</a>
      <a href="{% url 'about' %}" class="px-4 py-3 rounded-lg font-medium {% if '/about' == request.path %}bg-tt-orange text-white{% endif %}" :class="scrolled ? '{% if '/about' != request.path %}text-tt-navy hover:bg-tt-bg{% endif %}' : '{% if '/about' != request.path %}text-white/80 hover:bg-white/10{% endif %}'">Despre</a>
      <a href="{% url 'contact' %}" class="px-4 py-3 rounded-lg font-medium {% if '/contact' == request.path %}bg-tt-orange text-white{% endif %}" :class="scrolled ? '{% if '/contact' != request.path %}text-tt-navy hover:bg-tt-bg{% endif %}' : '{% if '/contact' != request.path %}text-white/80 hover:bg-white/10{% endif %}'">Contact</a>
      <a href="{% url 'faq' %}" class="px-4 py-3 rounded-lg font-medium {% if '/faq' == request.path %}bg-tt-orange text-white{% endif %}" :class="scrolled ? '{% if '/faq' != request.path %}text-tt-navy hover:bg-tt-bg{% endif %}' : '{% if '/faq' != request.path %}text-white/80 hover:bg-white/10{% endif %}'">FAQ</a>
    </div>
  </div>
</header>
